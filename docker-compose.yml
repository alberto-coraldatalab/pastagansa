services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pastagansa
      POSTGRES_USER: pastagansa
      POSTGRES_PASSWORD: pastagansa
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastagansa -d pastagansa"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
